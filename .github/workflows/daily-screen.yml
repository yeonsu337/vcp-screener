name: Daily VCP Screen

on:
  schedule:
    # Runs at 23:00 UTC Mon-Fri (= ~19:00 EST, after US market close)
    - cron: "0 23 * * 1-5"
  workflow_dispatch: {}  # manual trigger

# Serialize all runs of this workflow so the commit step never races against
# a parallel pipeline. Without this, scheduled run + workflow_dispatch can
# finish near-simultaneously and one push fails after 3 rebase attempts
# (incident: 2026-05-14 run #25834293114).
concurrency:
  group: daily-vcp-screen
  cancel-in-progress: false

permissions:
  contents: write  # needed to commit updated data back

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run daily screener
        run: python scripts/run_daily.py

      - name: Fetch macro / sentiment / liquidity data
        run: python scripts/fetch_macro.py
        continue-on-error: true

      - name: Generate Minervini bot calls (deterministic, no LLM)
        run: python scripts/generate_minervini_calls.py
        continue-on-error: true

      - name: Generate company research (Primary 12+)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/company_research.py
        continue-on-error: true
        timeout-minutes: 25

      - name: Generate Lessons Learned analytics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/lessons_analyzer.py
        continue-on-error: true

      - name: Translate research cards to Korean
        run: |
          python -m pip install deep-translator
          python scripts/translate_research.py
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): daily VCP scan $(date -u +%Y-%m-%d)"
          # Long-running job (~30min) may race with concurrent pushes.
          # Rebase onto remote before pushing; retry once if push still fails.
          for attempt in 1 2 3; do
            git pull --rebase origin main || true
            if git push origin main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying..."
            sleep 5
          done
          echo "::error::Push failed after 3 attempts"
          exit 1
